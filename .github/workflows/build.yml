name: Build Sonia Saj Ghor Receiver and Sender APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Receiver and Sender
        run: gradle :app:assembleDebug :sender:assembleDebug

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonia-Saj-Ghor-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonia-Saj-Ghor-Sender-APK
          path: sender/build/outputs/apk/debug/sender-debug.apk
